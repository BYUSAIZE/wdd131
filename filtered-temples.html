<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temple Album | Filtered Temples</title>
  <meta name="description" content="Explore and filter a photo album of LDS temples by size, location, and dedication date.">

    <nav id="main-nav">
      <ul>
        <li><a href="#" data-filter="home" class="active">Home</a></li>

        <li><a href="#" data-filter="small">Small</a></li>
